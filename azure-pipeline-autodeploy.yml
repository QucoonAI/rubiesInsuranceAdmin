# azure-pipelines.yml
trigger:
- dev

pool:
  vmImage: 'ubuntu-latest'

variables:
- group: GitHubMirrorKey
- name: githubOrg
  value: 'QucoonAI'

steps:
- checkout: self
  fetchDepth: 0
  persistCredentials: false

- script: |
    yarn install
    yarn build
  displayName: 'Build & Validate'
  env:
    NODE_OPTIONS: --max-old-space-size=4096

- script: |
    set -e
    echo "Starting GitHub Mirror Push..."

    # Configure Git identity for the push
    git config --global user.email "pipeline@qucoon.com"
    git config --global user.name "Azure Pipeline"

    # Build the authenticated HTTPS URL
    # The PAT is injected as the password; x-access-token is a GitHub convention
    TARGET_REPO="https://x-access-token:${GITHUB_ADMIN_TOKEN}@github.com/${GITHUB_ORG}/${REPO_NAME}.git"

    # Add or update the remote (idempotent)
    git remote add github "$TARGET_REPO" 2>/dev/null || git remote set-url github "$TARGET_REPO"

    # Push the current branch to the same branch name on GitHub
    git push github HEAD:refs/heads/${BRANCH_NAME} --force

    echo "Mirror push complete."
  displayName: 'Mirror to GitHub'
  condition: succeeded()
  env:
    GITHUB_MIRROR_TOKEN: $(GITHUB_ADMIN_TOKEN)
    GITHUB_ORG: $(githubOrg)
    REPO_NAME: $(Build.Repository.Name)
    BRANCH_NAME: $(Build.SourceBranchName)