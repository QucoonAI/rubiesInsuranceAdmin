trigger:
- develop

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js'

- script: |
    yarn install
    yarn build
  displayName: 'yarn install and build'


- task: S3Upload@1
  inputs:
    awsCredentials: 'RubiesAwsConnection'
    regionName: 'us-east-1'
    bucketName: 'insurance-admin.rubies.ng'
    sourceFolder: 'dist'
    globExpressions: '**'
    filesAcl: 'authenticated-read'
    createBucket: true
    
- task: AWSCLI@1
  inputs:
    awsCredentials: 'RubiesAwsConnection'
    regionName: 'us-east-1'
    awsCommand: 'cloudfront'
    awsSubCommand: 'create-invalidation'
    awsArguments: '--distribution-id E10UEF1IN53GP4 --paths "/*"'
  displayName: 'Invalidate CloudFront Cache'
